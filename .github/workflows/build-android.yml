name: Build VoiceDash

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  detector-tests:
    name: Voice detector unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile detector tests
        run: g++ -std=c++20 -Wall -Wextra -Werror -pedantic tests/voice_detector_tests.cpp src/voice/VoiceDetector.cpp -o /tmp/voicedash-detector-tests
      - name: Run detector tests
        run: /tmp/voicedash-detector-tests

  build:
    needs: [detector-tests]
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # Use the current stable SDK and matching bindings rather than pinning
          # an older SDK against newer generated bindings.
          sdk: latest
          target: ${{ matrix.config.target }}
          android-min-sdk: 26
          combine: true

  package:
    name: Package Android artifacts
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceDash-Android-Build
          path: ${{ steps.combine.outputs.build-output }}
